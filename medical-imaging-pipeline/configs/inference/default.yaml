# Inference config — FR-4.1..4.5, NFR Performance (Section 5)
patch_size: [128, 128, 128]
overlap: 0.5
blend_mode: "gaussian"          # FR-4.2

postprocess:
  min_component_voxels: 50      # FR-4.3 — connected-component filtering
  fill_holes: true

output:
  save_mask_nifti: true
  save_summary_json: true
  save_overlay_preview: true    # optional per FR-4.5

# NFR Performance target: <=30s full volume on RTX3090/4080-class GPU,
# <=4min CPU fallback, for standard 240x240x155 volume.
latency_budget_gpu_seconds: 30
latency_budget_cpu_seconds: 240
