# CI — Section 10.3: on PR, lint + type-check + unit tests.
# Docker build + model smoke test are separate follow-up jobs to add once
# src/ has real implementations (Section 10.3 "on merge to main").
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type-check (mypy)
        run: mypy src/ --ignore-missing-imports

      - name: Unit tests
        run: pytest tests/ -v --cov=src --cov-report=term-missing
