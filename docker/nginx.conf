# Frontend nginx config — serves the Vite build and proxies /v1 API calls
# to the api compose service, replicating the dev proxy in vite.config.js.
server {
    listen 80;

    # NIfTI uploads (4 modalities, ~40-50 MB compressed each) — default
    # 1 MB body limit would reject FR-1.1 uploads.
    client_max_body_size 500M;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown paths serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # FR-5.x endpoints -> FastAPI service (compose service name "api").
    location /v1 {
        # Resolve at request time via Docker's embedded DNS (127.0.0.11):
        # a boot-time resolve crashes nginx if the api container isn't
        # registered yet (startup race, hit 2026-09-13).
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        # Inference on CPU can take minutes (known gotcha) — don't let
        # nginx time out a legitimate long-running request.
        proxy_read_timeout 600s;
    }
}
