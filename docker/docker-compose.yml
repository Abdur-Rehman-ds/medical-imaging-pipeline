# Local/all-in-one orchestration — SRS Section 10.1.
# Rewritten 09-Sep-2026: postgres + minio services removed — deferred by
# Appendix E decision 7 (local-directory storage, no DB); they return if
# and when that decision is revisited. Frontend service to be added once
# its Dockerfile exists.
#
# Run from repo root:  docker compose -f docker/docker-compose.yml up
# Then:                curl http://localhost:8000/v1/models

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      # Active checkpoint (Section 10.2); file must exist in ../models.
      - MODEL_CHECKPOINT=${MODEL_CHECKPOINT:-models/fold0_best_e109_d0.8439.pt}
      # FR-5.4 model listing scans this directory.
      - MODEL_DIR=${MODEL_DIR:-models}
      # FR-5.6: unset API_KEY = open API (local dev); set it to enforce auth.
      - API_KEY=${API_KEY:-}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-60}
    volumes:
      # Checkpoints mounted read-only, never baked into the image
      # (Sections 7.3, 10.2).
      - ../models:/app/models:ro
      # Uploaded cases persist across container restarts (FR-1.5;
      # decision 7 local-directory backend).
      - case_uploads:/app/data/uploads

volumes:
  case_uploads:
