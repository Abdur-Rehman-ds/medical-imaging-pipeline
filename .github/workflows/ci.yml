# CI — SRS Section 10.3: lint, unit tests, image builds, synthetic smoke
# test on every PR and push to main. Rewritten 09-Sep-2026 from the
# Aug-30 stub: Python 3.12 + requirements.lock.txt (Section 2.5), Docker
# build + smoke-test jobs added; mypy non-blocking pending cleanup of 5
# pre-existing union-narrowing errors (see Appendix E).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (lockfile)
        run: pip install -r requirements.lock.txt

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type-check (mypy, non-blocking)
        continue-on-error: true
        run: mypy src/ --ignore-missing-imports

      - name: Unit tests
        run: pytest tests/ -v --cov=src --cov-report=term-missing
        env:
          PYTHONPATH: .

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t brats-api:ci .

      - name: Build frontend image
        run: docker build -f docker/Dockerfile.frontend -t brats-frontend:ci .

      # Section 10.3 "model smoke test": start the API with NO checkpoint
      # (untrained-dev path, same mode the unit tests use) and assert the
      # FR-5.4 endpoint answers. No BraTS data or weights in CI (7.3).
      - name: API container smoke test
        run: |
          docker run -d --name smoke -p 8000:8000 brats-api:ci
          sleep 8
          curl -sf http://localhost:8000/v1/models
          docker logs smoke
          docker rm -f smoke
