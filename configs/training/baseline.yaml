# Training config — FR-3.1..3.8, Section 9.2, Section 2.5 (16GB T4 budget)
#
# KAGGLE CONSTRAINT CHECK before changing these:
#   - patch_size 128^3 + batch_size 2 + channels above ~fits a 16GB T4 with
#     AMP on. Going to batch_size 4 at 128^3, or channels[-1] > 320,
#     risks OOM on a T4 — verified empirically, not guaranteed; watch
#     nvidia-smi on first run.
#   - 12-hr Kaggle session cap: checkpoint_every_epoch=true is mandatory,
#     not optional, or a session timeout loses unsaved progress (FR-3.3).

patch_size: [128, 128, 128]
batch_size: 2
positive_negative_ratio: 1.0   # FR-2.4

loss:
  dice_weight: 1.0
  ce_weight: 1.0

optimizer:
  name: "AdamW"
  lr: 1e-4
  weight_decay: 1e-5
  lr_schedule: "cosine_annealing"
scheduler:                      # Section 9.2 — implemented 2026-09-03
  t_max: 120                    # cosine period in epochs: fold-0 plan is
                                # 90 (done) + ~30 (chunk 3). Future folds
                                # use the same 120-epoch shape from epoch 0.
  eta_min: 1e-6                 # LR floor at the end of the cosine

amp: true                       # FR-3.5 — required to fit 16GB T4
grad_accumulation_steps: 1      # bump this instead of batch_size if OOM

max_epochs: 300                 # budget against 30 GPU-hrs/week — see
                                 # Section 12 Phase 2/3 notes; tune down if
                                 # per-epoch wall-clock makes this exceed
                                 # weekly quota across your fold count.
early_stopping_patience: 20

checkpoint_every_epoch: true    # FR-3.3, FR-3.7 — non-negotiable on Kaggle
checkpoint_dir: "/kaggle/working/checkpoints"
keep_top_k: 3

cross_validation:
  num_folds: 5                  # see configs/data/brats.yaml note on
                                 # reducing folds if quota-constrained
  patient_level_split: true     # Section 2.5 — mandatory, do not change

experiment_tracker: "wandb"     # FR-3.4 — W&B is what train.py uses
validation:                     # FR-3.3, FR-4.1, FR-9.3
  val_interval: 5               # run full sliding-window validation every
                                # N epochs (1 = every epoch). Chosen to fit
                                # the 30 GPU-hrs/week quota — SRS doesn't
                                # specify frequency; recorded 2026-09-02.
  sw_patch_size: [128, 128, 128]  # matches configs/inference/default.yaml
  sw_overlap: 0.5                 # FR-4.2 — keep consistent with inference
  sw_batch_size: 2                # patches per forward pass; safe on 16GB
                                  # T4 with no gradients. Drop to 1 if OOM.
