# Data config — FR-1.1 (accepted modalities), FR-1.5 (case storage),
# Section 2.5 (patient-level split mandatory)
modalities: ["t1", "t1ce", "t2", "flair"]
label_key: "seg"

# Confirmed on Kaggle (2026-08-30): using BraTS2020 rather than 2021 —
# permitted by Section 2.6 ("2020/2021 or later release"). Dataset:
# awsaf49/brats20-dataset-training-validation (42.8 GB, CC0 license,
# 369 training cases, 368 valid per data audit).
raw_data_dir: "/kaggle/input/datasets/awsaf49/brats20-dataset-training-validation/BraTS2020_TrainingData/MICCAI_BraTS2020_TrainingData"
processed_cache_dir: "/kaggle/working/processed"

# Split manifest — versioned file of case IDs + fold assignment, never a
# duplicated data copy (Section 7.3). Patient-level, not slice-level.
split_manifest: "configs/data/split_manifest.csv"
num_folds: 5
